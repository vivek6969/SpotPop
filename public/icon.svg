<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Dark Background Rounded App Icon -->
  <rect width="512" height="512" rx="128" fill="#090A0F"/>

  <defs>
    <!-- Vibrant Magenta Sticky Gradient -->
    <linearGradient id="spPinkGrad" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1493"/>
      <stop offset="100%" stop-color="#FF0077"/>
    </linearGradient>

    <!-- Curled Fold Gradient -->
    <linearGradient id="spFoldGrad" x1="310" y1="310" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB3D4"/>
      <stop offset="100%" stop-color="#FF8FBE"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="stickyShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#FF0077" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Centered Tilted Sticky Note Container (-5.5 deg) -->
  <g transform="rotate(-5.5 256 266)" filter="url(#stickyShadow)">
    <!-- Main Pink Sticky Note Body with Cut Bottom-Right Corner -->
    <path
      d="M 170 120 
         L 342 120 
         A 48 48 0 0 1 390 168 
         L 390 310 
         L 310 390 
         L 170 390 
         A 48 48 0 0 1 122 342 
         L 122 168 
         A 48 48 0 0 1 170 120 Z"
      fill="url(#spPinkGrad)"
    />

    <!-- Folded Ear Shadow -->
    <path
      d="M 390 310 L 310 390 L 302 318 Z"
      fill="#8B0045"
      opacity="0.4"
    />

    <!-- Curled / Folded Bottom-Right Ear -->
    <path
      d="M 390 310 
         Q 330 320 310 390 
         C 324 350 355 324 390 310 Z"
      fill="url(#spFoldGrad)"
    />

    <!-- Translucent Tape at Top -->
    <rect
      x="200"
      y="84"
      width="112"
      height="46"
      rx="10"
      transform="rotate(2 256 107)"
      fill="#FFE0ED"
      fill-opacity="0.82"
      stroke="rgba(255,255,255,0.5)"
      stroke-width="3"
    />

    <!-- Bold Rounded White Letters "SP" -->
    <text
      x="248"
      y="285"
      fill="#FFFFFF"
      font-family="'Outfit', 'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', sans-serif"
      font-weight="900"
      font-size="142"
      letter-spacing="-6"
      text-anchor="middle"
      dominant-baseline="middle"
    >SP</text>
  </g>
</svg>
